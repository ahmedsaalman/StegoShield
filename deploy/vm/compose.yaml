# Production stack for one small Linux VM: the app image (built by GitHub Actions) plus Caddy for HTTPS.
# Run from this folder: docker compose up -d  (settings come from ./.env, written by setup.sh)
#
# Defaults suit a 1 GB VM (Google Cloud e2-micro): one worker, one heavy job at a time, and uploads up to
# 1 megapixel, which keeps the app under ~600 MB. On a bigger VM raise them in .env, for example
# APP_WORKERS=2, MAX_CONCURRENT_JOBS=2, MAX_IMAGE_PIXELS=16777216, APP_MEMORY_LIMIT=4g.
name: stegoshield

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/ahmedsaalman/stegoshield}:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    command:
      - uvicorn
      - api.main:app
      - --host=0.0.0.0
      - --port=8000
      - --workers=${APP_WORKERS:-1}
      - --proxy-headers
      - --no-access-log
    environment:
      STEGOSHIELD_ENABLE_HSTS: "1"
      STEGOSHIELD_MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-1}
      STEGOSHIELD_MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-1048576}
      # Port 8000 is not published, so only Caddy can reach the app. Caddy overwrites any X-Forwarded-For
      # a client sends, so trusting it gives correct per-visitor rate limits.
      FORWARDED_ALLOW_IPS: "*"
    expose:
      - "8000"
    # Past this the container is restarted instead of the whole VM running out of memory.
    mem_limit: ${APP_MEMORY_LIMIT:-800m}

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in deploy/vm/.env (setup.sh writes it)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # HTTPS certificates; keep across restarts to stay inside Let's Encrypt rate limits
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
