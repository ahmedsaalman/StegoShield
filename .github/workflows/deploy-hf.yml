# Tests every push to main, then publishes it to the Hugging Face Space (the examiners' demo link).
# GitHub's runners do the upload, so the developer's own network never has to reach huggingface.co.
#
# One-time setup in GitHub → Settings → Secrets and variables → Actions:
#   Secret   HF_TOKEN  : a Hugging Face access token with write permission
#   Variable HF_SPACE  : the Space id, OWNER/NAME (created on the first run if it doesn't exist)
name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "requirements.txt"
      - "core/**"
      - "ml/**"
      - "api/**"
      - "models/**"
      - "experiments/**"
      - "frontend/**"
      - "deploy/**"
      - ".github/workflows/deploy-hf.yml"
  workflow_dispatch:

concurrency:
  group: deploy-hf
  cancel-in-progress: false # never cut an upload off halfway

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: npm --prefix frontend ci --no-audit --no-fund
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build

  deploy:
    needs: test
    if: vars.HF_SPACE != '' # skipped, not failed, until the Space is configured
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check the Space settings exist
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "::error::Set the HF_TOKEN secret and the HF_SPACE variable (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install huggingface_hub==2.5.0
      - name: Publish HEAD to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: python -m deploy.hf_space --space "$HF_SPACE"
