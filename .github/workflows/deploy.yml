# On every push to main that touches the app: test it, build the image into ghcr.io, then redeploy the VM.
# The VM only pulls the image, so a 1 GB machine (Google Cloud e2-micro) never has to build it.
#
# One-time setup (README, "Hosted demo"): make the ghcr.io package public after the first run, then in
# GitHub → Settings → Secrets and variables → Actions:
#   Variables VM_HOST, VM_USER     : the VM's public IP, and the login name setup.sh prints
#   Secrets   VM_SSH_KEY           : private half of the deploy key (the VM lets it run update.sh only)
#             VM_KNOWN_HOSTS       : output of `ssh-keyscan -t ed25519 <ip>`, so the runner can verify the VM
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "requirements.txt"
      - "core/**"
      - "ml/**"
      - "api/**"
      - "models/**"
      - "experiments/**"
      - "frontend/**"
      - "deploy/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false # never cut a deploy off halfway

permissions:
  contents: read

env:
  IMAGE: ghcr.io/ahmedsaalman/stegoshield

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: npm --prefix frontend ci --no-audit --no-fund
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: vars.VM_HOST != '' # skipped, not failed, until the VM is configured
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Redeploy the VM
        env:
          VM_HOST: ${{ vars.VM_HOST }}
          VM_USER: ${{ vars.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          if [ -z "$VM_USER" ] || [ -z "$VM_SSH_KEY" ] || [ -z "$VM_KNOWN_HOSTS" ]; then
            echo "::error::Set VM_USER (variable) and the VM_SSH_KEY and VM_KNOWN_HOSTS secrets."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # authorized_keys forces this key to run deploy/vm/update.sh; the sha is its only input.
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            "$VM_USER@$VM_HOST" "$GITHUB_SHA"
