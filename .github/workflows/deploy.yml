# Tests every push to main, then redeploys the Oracle Cloud VM (the examiners' demo link) over SSH.
#
# One-time setup in GitHub → Settings → Secrets and variables → Actions (steps in README, "Hosted demo"):
#   Variable ORACLE_HOST         : the VM's public IP address
#   Secret   ORACLE_SSH_KEY      : private half of the deploy key (the VM lets it run update.sh only)
#   Secret   ORACLE_KNOWN_HOSTS  : output of `ssh-keyscan -t ed25519 <ip>`, so the runner can verify the VM
name: Deploy to Oracle Cloud

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "requirements.txt"
      - "core/**"
      - "ml/**"
      - "api/**"
      - "models/**"
      - "experiments/**"
      - "frontend/**"
      - "deploy/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false # never cut a deploy off halfway

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: npm --prefix frontend ci --no-audit --no-fund
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build

  deploy:
    needs: test
    if: vars.ORACLE_HOST != '' # skipped, not failed, until the VM is configured
    runs-on: ubuntu-latest
    timeout-minutes: 20 # the first ARM build of the image takes several minutes
    steps:
      - name: Redeploy the VM
        env:
          ORACLE_HOST: ${{ vars.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          if [ -z "$ORACLE_SSH_KEY" ] || [ -z "$ORACLE_KNOWN_HOSTS" ]; then
            echo "::error::Set the ORACLE_SSH_KEY and ORACLE_KNOWN_HOSTS secrets (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$ORACLE_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The VM's authorized_keys forces this key to run deploy/oracle/update.sh, whatever command is sent.
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 "ubuntu@$ORACLE_HOST" update
